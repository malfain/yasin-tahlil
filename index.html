<!doctype html>
<html lang="id" class="theme-muslim">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yasin &amp; Tahlil</title>
<meta name="description" content="Surah Yasin, bacaan Tahlil dengan penghitung, dan jadwal sholat &amp; imsak.">
<meta name="theme-color" content="#1f5a46">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/app.css">
<script>
  // Alamat wildcard server lokal ([::] / 0.0.0.0) bukan "secure context", sehingga browser
  // memblokir lokasi GPS. Alihkan ke localhost yang diizinkan.
  if (['[::]', '0.0.0.0'].includes(location.hostname)) {
    location.replace(location.href.replace(location.hostname, 'localhost'));
  }
  // Terapkan mode gelap sebelum render agar tidak berkedip.
  try { if (JSON.parse(localStorage.getItem('yt:dark')) === true) document.documentElement.classList.add('dark'); } catch (e) {}
</script>
<script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="phone" id="phone">
    <div class="screen-host" id="screen-host"></div>
    <div class="drawer" id="drawer" hidden></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>
  <noscript><p class="noscript">Aplikasi ini memerlukan JavaScript.</p></noscript>
</body>
</html>
